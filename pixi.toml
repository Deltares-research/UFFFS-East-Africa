[workspace]
name = "ufffs"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.13.*"
snakemake = "9.21.*"
hydromt = "1.3.1.*"

# scientific stack
numpy = "2.3.*"
pandas = "2.3.*"
xarray = "2026.2.*"
scipy = "1.17.*"

# geospatial
geopandas = "1.1.*"
rasterio = ">=1.4"
shapely = "2.1.*"
pyproj = ">=3.6"
rioxarray = "0.22.*"

# plotting
matplotlib = "3.10.*"
cartopy = "0.25.*"

# utilities
pyyaml = "6.0.*"
ipykernel = ">=7.3.0,<8"

# data versioning (DVC + MinIO/S3 remote)
dvc-s3 = "*"

[tasks]
run = "snakemake -c 1 -s workflows/Snakefile"

[pypi-dependencies]
hydromt-sfincs = { git = "https://github.com/Deltares/hydromt_sfincs.git", tag = "v2.0.0-rc2" }

# DAG visualization kept in its own feature/environment so graphviz's
# transitive deps (libglib/pcre2) can't block the main geospatial env solve.
[feature.dag.dependencies]
graphviz = ">=9"

[feature.dag.tasks]
dag = "snakemake -s workflows/Snakefile --rulegraph | dot -Grankdir=LR -Tsvg > rulegraph.svg"

[environments]
dag = ["dag"]
