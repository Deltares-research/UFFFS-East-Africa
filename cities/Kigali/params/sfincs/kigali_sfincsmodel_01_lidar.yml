steps:
  override:
    - subgrid.create:
        elevation_list:
        - elevation: Kigali_DEM_1m
          zmin: 0.001
        - elevation: copdem30
          zmin: 0.001
        roughness_list:
        - lulc: esa_worldcover
        nr_subgrid_pixels: 10  # number of subgrid pixels per grid cell (e.g. 4 = 4x4 = 16 subgrid pixels per grid cell)
        buffer_cells : 5  
        write_dep_tif : true  # write depth-dependent subgrid tables as GeoTIFFs (for debugging/visualization)
        write_man_tif : true  # write roughness-based subgrid tables as GeoTIFFs (for debugging/visualization)